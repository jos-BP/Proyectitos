<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de Registro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card shadow-sm p-4 style-card" style="width: 100%; max-width: 450px; border-radius: 12px;">
      
      <h3 class="text-center mb-4 text-primary fw-bold">Registro de Usuario</h3>
      
      <form>
        <div class="mb-3">
          <label for="carnet" class="form-label font-weight-bold">Carnet</label>
          <input type="text" class="form-control" id="carnet" placeholder="Ingresa tu carnet" required>
        </div>

        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre Completo</label>
          <input type="text" class="form-control" id="nombre" placeholder="Ingresa tu nombre" required>
        </div>

        <div class="mb-3">
          <label for="edad" class="form-label">Edad</label>
          <input type="number" class="form-control" id="edad" placeholder="Ingresa tu edad" min="1" max="120" required>
        </div>

        <div class="mb-4">
          <label for="genero" class="form-label">Género</label>
          <select class="form-select" id="genero" required>
            <option value="" selected disabled>Selecciona una opción</option>
            <option value="Masculino">Masculino</option>
            <option value="Femenino">Femenino</option>
            <option value="Otro">Otro</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Enviar Datos</button>
      </form>

    </div>
  </div>

</body>
</html>
